name: Staging smoke

# Every day, the parameterless `mcp` reads of the catalog run against the
# PatrolTech staging API with a read-only token, and the run fails on any
# contract error (scripts/staging-smoke.mjs). Only from main: pull requests,
# forks included, never get these secrets.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets STAGING_API_URL and STAGING_TOKEN (read-only) and variable
    # STAGING_ORGANIZATION_ID live in this environment.
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Mask the staging values
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_ORGANIZATION_ID: ${{ vars.STAGING_ORGANIZATION_ID }}
        run: |
          echo "::add-mask::$STAGING_API_URL"
          echo "::add-mask::${STAGING_API_URL#*://}"
          echo "::add-mask::$STAGING_ORGANIZATION_ID"

      - name: Run the catalog reads against staging
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
          STAGING_ORGANIZATION_ID: ${{ vars.STAGING_ORGANIZATION_ID }}
        run: npm run smoke:staging
